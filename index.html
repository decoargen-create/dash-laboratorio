<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/kombialo-favicon.svg" />
    <link rel="apple-touch-icon" href="/kombialo-apple-touch.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kombialo" />
    <meta name="description" content="Kombialo — Plataforma de creación de creativos para Meta Ads." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Allura&family=Sora:wght@600;700;800&family=Montserrat:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Kombialo</title>
    <script>
      // Aplica dark mode + preferencias de apariencia (tamaño, fuente) antes
      // del render para evitar flash de tema/tamaño viejo.
      (function () {
        try {
          // Kombialo es siempre modo oscuro (se sacó el modo claro).
          document.documentElement.classList.add('dark');
          var de = document.documentElement;
          var sz = localStorage.getItem('dash-text-size') || 'mediano';
          de.style.zoom = ({ chico: 1, mediano: 1.1, grande: 1.22 })[sz] || 1.1;
          var font = localStorage.getItem('dash-ui-font');
          if (font === 'montserrat') de.style.fontFamily = "'Montserrat', system-ui, -apple-system, sans-serif";
          else if (font === 'nunito') de.style.fontFamily = "'Nunito', system-ui, -apple-system, sans-serif";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
